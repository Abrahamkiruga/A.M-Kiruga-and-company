<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img" aria-label="Bar chart showing steady revenue growth" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.bar{transform-origin:bottom;transform-box:fill-box;animation:grow .9s ease-out both}@keyframes grow{from{transform:scaleY(0)}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style>
<g fill="#f6f8f5" opacity=".35">
<rect class="bar" x="12" y="120" width="36" height="60" rx="3"/><rect class="bar" x="64" y="105" width="36" height="75" rx="3" style="animation-delay:.08s"/>
<rect class="bar" x="116" y="90" width="36" height="90" rx="3" style="animation-delay:.16s"/><rect class="bar" x="168" y="75" width="36" height="105" rx="3" style="animation-delay:.24s"/>
<rect class="bar" x="220" y="50" width="36" height="130" rx="3" style="animation-delay:.32s"/></g>
<rect class="bar" x="272" y="24" width="36" height="156" rx="3" fill="#c79a3b" style="animation-delay:.4s"/>
<line x1="0" y1="181" x2="320" y2="181" stroke="#f6f8f5" opacity=".4"/>
</svg>
